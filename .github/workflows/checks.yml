name: Verify local runtimes
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, pdo_sqlite, mbstring, openssl
      - run: npm ci
      - run: python tests/run_local.py php
      - run: php tests/kuaishou.test.php
      - run: python tests/run_local.py worker
      - run: npm run test:zip
      - run: npm run test:frontend
      - run: npm run test:login
      - run: npm run test:platforms
      - run: npm run build
