plugins { id 'com.android.application' }

android {
    namespace 'cn.shiying.studio'
    compileSdk 35
    defaultConfig {
        applicationId 'cn.shiying.studio'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '1.1.2'
        testInstrumentationRunner 'cn.shiying.studio.DownloadCheck'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('ANDROID_KEYSTORE_PATH') ?: '../signing.p12')
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            keyAlias 'shiying'
            keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            storeType 'PKCS12'
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false; debuggable false }
    }
    testBuildType 'release'
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main.assets.srcDir layout.buildDirectory.dir('generated/webAssets') }
}

tasks.register('bundleFrontend', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'scripts/bundle-android.mjs'
    inputs.dir rootProject.projectDir.parentFile.toPath().resolve('web').toFile()
    inputs.file rootProject.projectDir.parentFile.toPath().resolve('android/native-downloads.js').toFile()
    inputs.file rootProject.projectDir.parentFile.toPath().resolve('android/native-ui.js').toFile()
    inputs.file rootProject.projectDir.parentFile.toPath().resolve('android/mobile.css').toFile()
    inputs.file rootProject.projectDir.parentFile.toPath().resolve('config/media-hosts.json').toFile()
    inputs.file rootProject.projectDir.parentFile.toPath().resolve('config/parser-hosts.json').toFile()
    inputs.file rootProject.projectDir.parentFile.toPath().resolve('android/device-parser.mjs').toFile()
    inputs.file rootProject.projectDir.parentFile.toPath().resolve('api/douyin-cloudflare workers/workers.js').toFile()
    inputs.dir rootProject.projectDir.parentFile.toPath().resolve('cloudflare').toFile()
    inputs.file rootProject.projectDir.parentFile.toPath().resolve('scripts/bundle-android.mjs').toFile()
    inputs.file rootProject.projectDir.parentFile.toPath().resolve('LICENSE').toFile()
    outputs.dir layout.buildDirectory.dir('generated/webAssets')
}
tasks.named('preBuild').configure { dependsOn 'bundleFrontend' }
